<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 484" width="1200" height="484" role="img" aria-labelledby="t">
<title id="t">The last 24 hours of the operation, played back: 0 pushes, 0 changes asked, 0 approved, 0 merged, 0 released, and pitlane's jobs for each hour. Each mark is one public event at the time it happened.</title>
<style>
  text { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; }
  .live { animation: live 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes live { 0%,100% { opacity: 1; transform: scale(1) } 50% { opacity: .35; transform: scale(.7) } }
  .ring { animation: ring 1.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes ring { 0% { opacity: .8; transform: scale(1) } 100% { opacity: 0; transform: scale(3.2) } }
  
  .n { opacity: .34; transform-box: fill-box; transform-origin: center; animation: hit 48s linear infinite; }
  .bar { opacity: .5; animation: lift 48s linear infinite; }
  .head { animation: sweep 48s linear infinite; }
  @keyframes hit { 0% { opacity: 1; transform: scaleY(1.7) scaleX(1.5) } 5% { opacity: .75; transform: scaleY(1) scaleX(1) } 16% { opacity: .34 } 100% { opacity: .34 } }
  @keyframes lift { 0% { opacity: 1 } 7% { opacity: .85 } 20% { opacity: .5 } 100% { opacity: .5 } }
  @keyframes sweep { from { transform: translateX(0) } to { transform: translateX(990px) } }
  @media (prefers-reduced-motion: reduce) { .n, .bar { opacity: .9 } .head { display: none } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
</style>
<defs>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".55"/><stop offset=".5" stop-color="#2a1f47"/><stop offset="1" stop-color="#e879f9" stop-opacity=".45"/></linearGradient>
  <radialGradient id="wash" cx=".15" cy="0" r="1"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".16"/><stop offset=".6" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <linearGradient id="jobsFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0abfc"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
  <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e879f9" stop-opacity="0"/><stop offset="1" stop-color="#e879f9" stop-opacity=".2"/></linearGradient>
</defs>
