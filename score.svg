<title id="t">The last 24 hours of the operation, played back: 2 pushes, 1 changes asked, 30 approved, 9 merged, 0 released, and pitlane's jobs for each hour. Each mark is one public event at the time it happened.</title>
<style>
  text { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; }
  .live { animation: live 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes live { 0%,100% { opacity: 1; transform: scale(1) } 50% { opacity: .35; transform: scale(.7) } }
  .ring { animation: ring 1.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes ring { 0% { opacity: .8; transform: scale(1) } 100% { opacity: 0; transform: scale(3.2) } }
  
  .n { opacity: .34; transform-box: fill-box; transform-origin: center; animation: hit 48s linear infinite; }
  .bar { opacity: .5; animation: lift 48s linear infinite; }
  .head { animation: sweep 48s linear infinite; }
  @keyframes hit { 0% { opacity: 1; transform: scaleY(1.7) scaleX(1.5) } 5% { opacity: .75; transform: scaleY(1) scaleX(1) } 16% { opacity: .34 } 100% { opacity: .34 } }
  @keyframes lift { 0% { opacity: 1 } 7% { opacity: .85 } 20% { opacity: .5 } 100% { opacity: .5 } }
  @keyframes sweep { from { transform: translateX(0) } to { transform: translateX(990px) } }
  @media (prefers-reduced-motion: reduce) { .n, .bar { opacity: .9 } .head { display: none } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
</style>
