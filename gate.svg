  @keyframes block { 0% { transform: translateX(150px); opacity: 0 } 0.78% { opacity: 1 } 6.56% { transform: translateX(430px) } 10.63% { transform: translateX(430px); opacity: 1 } 12.81% { transform: translate(410px, 70px) rotate(-8deg); opacity: 0 } 100% { transform: translate(410px, 70px); opacity: 0 } }
