  @keyframes stampApprove { 0%, 6.56% { opacity: 0 } 7.34% { opacity: 1 } 10.00% { opacity: .45 } 10.94% { opacity: 1 } 11.88% { opacity: 1 } 12.81%,100% { opacity: 0 } }
  @keyframes stampAllow { 0%, 6.56% { opacity: 0 } 7.34% { opacity: 1 } 10.16%,100% { opacity: 0 } }
