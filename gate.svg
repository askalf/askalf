<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 432" width="1000" height="432" role="img" aria-labelledby="t">
<title id="t">redstamp, illustrated: tool calls from an agent meet the redstamp gate. read_file, http.get to the GitHub API and npm test are allowed; curl piped to sh, a request to the cloud metadata address, a write to authorized_keys and piping env to curl are blocked; a force push is held for human approval. Every verdict lands in a hash-chained audit trail.</title>
<style>
