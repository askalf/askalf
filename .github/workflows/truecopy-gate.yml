# Gates what the Redline reviewer reads with truecopy: its tools (scripts/redline/tools.json,
# written from TOOLS in review.mjs) and its system prompt (scripts/redline/prompt.md), both pinned
# in truecopy.lock. The chain is code -> manifest (--check) -> lock (truecopy verify): a change
# to a tool or to the prompt fails until it is re-pinned with `truecopy add`, which poison-scans
# it first.
name: truecopy gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# attestations: read lets the action check the Sigstore attestation of the truecopy tarball
# before installing it.
permissions:
  contents: read
  attestations: read

jobs:
  verify:
    name: verify pinned reviewer surface
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: askalf/checkout-with-retry@115a6407547e9711edbc2e915838d495cad9583f  # v1.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: tools.json matches TOOLS
        run: node scripts/redline/dump-tools.mjs --check
      - name: truecopy verify
        uses: askalf/truecopy-action@b2b1b9cf34bb37377878c3c8d59efd54bd030e0f # v1.1.1
        with:
          verify-attestation: 'true'
