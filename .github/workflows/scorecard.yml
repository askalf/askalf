# OpenSSF Scorecard: supply-chain checks (branch protection, token permissions, pinned dependencies,
# CI tests and more). Results are published so the scorecard.dev API shows the current score; the
# SARIF also lands in code scanning.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '37 2 * * 1' # weekly, Monday 02:37 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write # upload the SARIF to code scanning
      id-token: write # publish_results signs its upload with the job's OIDC token
    steps:
      - name: Checkout code
        # Scorecard publishes only from a workflow whose steps it recognises, so the checkout is
        # actions/checkout itself; this job runs on a hosted runner, which needs no retry.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Branch-Protection is scored from what the job token can read: a public repository's
          # public rules. A fine-grained token with administration: read in SCORECARD_TOKEN would
          # also read the admin-only settings.
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
