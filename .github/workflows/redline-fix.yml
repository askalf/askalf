# Redline fix: when Redline requests changes on a pull request here, the ops tick dispatches this run
# with the PR, the head Redline reviewed and the review. The fix itself is computed by
# askalf/ci (redline-fix-run.yml) on this repository's fix-lane runner and uploaded as
# the redline-fix artifact. Nothing here pushes or comments, and no token that could is on the
# runner: the ops tick verifies the artifact and pushes the fix to the PR branch with its own token.
name: Redline fix
run-name: Redline fix ${{ github.repository }}#${{ inputs.pr }} @ ${{ inputs.head }}

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number.
        required: true
        type: string
      head:
        description: The full commit sha Redline reviewed. The run fails if the PR has moved past it.
        required: true
        type: string
      review:
        description: URL of the REQUEST_CHANGES review being answered.
        required: true
        type: string
      dry_run:
        description: Compute the fix and upload its diff; no commit, no bundle.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: read

# No concurrency group: the ops tick dispatches one run per review and reads each run's artifact, and
# a group keeps only one pending run, so a third dispatch for a PR would cancel the second.
# Overlapping runs are safe without one: each is pinned to the head it was given and fails once
# the PR moves past it, and the ops tick pushes a bundle only as a fast-forward of the PR branch.

jobs:
  fix:
    # Pinned so a change to the fix workflow reaches this repo only through a reviewed bump here.
    uses: askalf/ci/.github/workflows/redline-fix-run.yml@cf3327ecdb3de75efa601181bd5ca91c2e17ec2a # main 2026-11-02, askalf/ci#157
    with:
      redline-ref: cf3327ecdb3de75efa601181bd5ca91c2e17ec2a
      # askalf-fix is this repository's fix-lane runner: its own non-root account, one job
      # per registration. Only this workflow targets that label.
      runner-label: askalf-fix
      pr: ${{ inputs.pr }}
      head: ${{ inputs.head }}
      review: ${{ inputs.review }}
      dry_run: ${{ inputs.dry_run }}
