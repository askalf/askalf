# Redline fix: the first-party answer to a Redline REQUEST_CHANGES, as a CI job. Each repository
# calls this from its own redline-fix.yml (workflow_dispatch; forge dispatches it with the PR, the
# head Redline reviewed and the review). The job checks out that head on the repository's own
# non-root exec runner, lets the fix script edit and test inside it, and uploads the result as the
# redline-fix artifact: fix.json, notes.md and, when there is a fix, fix.bundle (one commit on top
# of the head). The job's status is the outcome: 0 for fixed, 1 for anything else.
# Nothing here pushes or comments and no token that could is on the runner: forge verifies the
# artifact (the run came from the pinned redline-fix.yml, the bundle is one fast-forward commit as
# askalf with no attribution) and pushes it to the PR branch with the token it already holds.
# The model key is the fix lane's own named dario key in FIX_ENV_FILE, root:gha-exec 640: readable
# by the exec account that runs this job and by nothing else, in particular never by gha-oss, which
# runs untrusted upstream candidates' test suites on the same host.
# The caller's runs-on is [self-hosted, <repo>-exec] (platform deploy/gha-runners, row
# <repo>-exec-e1); a job that uses a reusable workflow takes no runs-on of its own, so the caller
# passes the label as runner-label.
name: Redline fix run

on:
  workflow_call:
    inputs:
      runner-label:
        description: The caller's exec runner label, <repo>-exec.
        required: true
        type: string
      redline-ref:
        description: >-
          The full commit sha of askalf/askalf this workflow is called at, the same sha as the
          caller's uses pin. The fix script is fetched at it. It must be a commit on main.
        required: true
        type: string
      pr:
        description: Pull request number.
        required: true
        type: string
      head:
        description: The full commit sha Redline reviewed; the job fails if the PR is not at it.
        required: true
        type: string
      review:
        description: URL of the REQUEST_CHANGES review being answered.
        required: true
        type: string
      dry_run:
        description: Compute the fix and upload its diff; no commit, no bundle.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: read

jobs:
  fix:
    runs-on: [self-hosted, "${{ inputs.runner-label }}"]
    timeout-minutes: 60
    steps:
      # github.job_workflow_sha is not available to expressions, so the caller passes the sha it
      # pins as redline-ref. It must be a full sha, so it cannot name a moving branch or tag, and
      # a commit on main, so a PR cannot point the fix at a script from its unmerged branch.
      - name: Check the review ref is a full commit sha
        env:
          REDLINE_REF: ${{ inputs.redline-ref }}
        run: |
          if ! [[ "$REDLINE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::redline-ref must be the full 40-character commit sha the caller pins; got '${REDLINE_REF}'"
            exit 1
          fi

      # The head is a full sha and the review link names this repository and this PR, before
      # anything is fetched.
      - name: Check the head and the review link
        env:
          HEAD_SHA: ${{ inputs.head }}
          PR: ${{ inputs.pr }}
          REVIEW_URL: ${{ inputs.review }}
          REPO: ${{ github.repository }}
        run: |
          if ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::head must be the full 40-character commit sha Redline reviewed; got '${HEAD_SHA}'"
            exit 1
          fi
          if ! [[ "$PR" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::pr must be a pull request number; got '${PR}'"
            exit 1
          fi
          if [[ "$REVIEW_URL" != "https://github.com/${REPO}/pull/${PR}#pullrequestreview-"* ]] || ! [[ "${REVIEW_URL##*#pullrequestreview-}" =~ ^[0-9]+$ ]]; then
            echo "::error::review must be a review link on ${REPO}#${PR}; got '${REVIEW_URL}'"
            exit 1
          fi

      - name: Check the review ref is on askalf/askalf main
        env:
          REDLINE_REF: ${{ inputs.redline-ref }}
          GH_READ_TOKEN: ${{ github.token }}
        # main is ahead of or identical to the ref exactly when the ref is on main. A failed read
        # is retried, then fails the job: it is never taken as a pass.
        run: |
          node --input-type=module -e '
            const ref = process.env.REDLINE_REF;
            const url = `https://api.github.com/repos/askalf/askalf/compare/${ref}...main`;
            const headers = { authorization: `Bearer ${process.env.GH_READ_TOKEN}`, accept: "application/vnd.github+json" };
            let status = "";
            for (let attempt = 1; attempt <= 3 && !status; attempt++) {
              try {
                const res = await fetch(url, { headers });
                if (res.ok) status = String((await res.json()).status ?? "");
                else console.log(`attempt ${attempt}: HTTP ${res.status}`);
              } catch (e) { console.log(`attempt ${attempt}: ${e.message}`); }
              if (!status && attempt < 3) await new Promise((r) => setTimeout(r, attempt * 5000));
            }
            if (status === "ahead" || status === "identical") { console.log(`redline-ref ${ref} is on main`); process.exit(0); }
            console.log(status
              ? `::error::redline-ref ${ref} is not a commit on askalf/askalf main (${status})`
              : `::error::could not compare redline-ref ${ref} with askalf/askalf main`);
            process.exit(1);
          '

      - name: Fetch the fix script from askalf/askalf
        uses: askalf/checkout-with-retry@115a6407547e9711edbc2e915838d495cad9583f  # v1.1.0
        with:
          repository: askalf/askalf
          ref: ${{ inputs.redline-ref }}
          path: .redline
          sparse-checkout: scripts/redline
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check out the PR head to fix
        uses: askalf/checkout-with-retry@115a6407547e9711edbc2e915838d495cad9583f  # v1.1.0
        with:
          ref: ${{ inputs.head }}
          path: pr
          persist-credentials: false

      # The checkout must be the reviewed head exactly: a PR that moved gets a new dispatch from
      # forge at its new head, never a fix computed against the old one.
      - name: Check the checkout is at the head
        env:
          HEAD_SHA: ${{ inputs.head }}
        run: |
          at="$(git -C pr rev-parse HEAD)"
          if [ "$at" != "$HEAD_SHA" ]; then
            echo "::error::the checkout is at ${at}, not at ${HEAD_SHA}: the PR moved; dispatch again at its new head"
            exit 1
          fi

      # The PR's own test script needs a toolchain; node 22 comes from the exec tier's own tool
      # cache, never from the host.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Fix
        env:
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          HEAD_SHA: ${{ inputs.head }}
          REVIEW_URL: ${{ inputs.review }}
          CHECKOUT: ${{ github.workspace }}/pr
          GH_READ_TOKEN: ${{ github.token }}
          # root:gha-exec 640 on the host; holds the named dario key first-party-fix and nothing
          # else. Never gha-oss-readable: that account runs untrusted test suites.
          FIX_ENV_FILE: /etc/askalf/fix-exec.env
          FIX_OUT: ${{ github.workspace }}/fix-out
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node .redline/scripts/redline/fix.mjs

      # fix.json goes up whatever the outcome; forge reads it to know why there is no bundle.
      - name: Upload the fix
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: redline-fix
          path: fix-out
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

      - name: Remove the checkouts
        if: always()
        run: rm -rf pr .redline fix-out
