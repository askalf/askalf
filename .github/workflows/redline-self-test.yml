# Runs Redline's tests on any change to the review script or its reusable workflow.
# The model and GitHub are stubbed; no credentials are used.
name: Redline self-test

on:
  pull_request:
    paths:
      - scripts/redline/**
      - .github/workflows/redline-review.yml
      - .github/workflows/redline-self-test.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: askalf/checkout-with-retry@115a6407547e9711edbc2e915838d495cad9583f  # v1.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: node scripts/redline/review.test.mjs
