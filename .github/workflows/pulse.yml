# Redraws the profile's live panels from npm and GitHub and publishes them to
# the orphan `pulse` branch, which README.md links to. Force-pushing a single
# commit there keeps main's history clean and needs no write to main.
name: pulse

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['README.md', 'pulse/**', '.github/workflows/pulse.yml']
  pull_request:
    paths: ['README.md', 'pulse/**', '.github/workflows/pulse.yml']

permissions: {}

concurrency:
  group: pulse-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  # Render holds a read-only token: it also runs on pull requests, where nothing may write.
  # The write scope lives only in publish, which never runs on a pull request.
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test
        run: node --test pulse/data.test.mjs

      - name: Restore the last good state
        run: |
          mkdir -p out
          if git fetch --depth=1 origin pulse 2>/dev/null; then
            git show FETCH_HEAD:state.json > out/state.json || rm -f out/state.json
          fi

      - name: Render
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node pulse/render.mjs --out out | tee render.log
          {
            echo '### pulse'
            echo '```'
            cat render.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pulse-out
          path: out
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: render
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pulse-out
          path: out

      - name: Publish to the pulse branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        working-directory: out
        run: |
          cat > README.md <<'MD'
          Generated by [.github/workflows/pulse.yml](../../blob/main/.github/workflows/pulse.yml) from [pulse/](../../tree/main/pulse). Rewritten on every run; do not edit.
          MD
          git init -q -b pulse
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "pulse: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pulse
