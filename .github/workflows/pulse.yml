# Redraws the profile's live panels from npm and GitHub and publishes them to
# the orphan `pulse` branch, which README.md links to. Force-pushing a single
# commit there keeps main's history clean and needs no write to main.
# Pull requests render through pulse-check.yml instead, so this workflow never
# runs where it may not publish.
name: pulse

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['README.md', 'pulse/**', '.github/workflows/pulse.yml', '.github/workflows/pulse-render.yml']

permissions: {}

concurrency:
  group: pulse-publish
  cancel-in-progress: false

jobs:
  # Render holds a read-only token; the write scope lives only in publish.
  render:
    permissions:
      contents: read
    uses: ./.github/workflows/pulse-render.yml

  publish:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pulse-out
          path: out

      - name: Publish to the pulse branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        working-directory: out
        run: |
          cat > README.md <<'MD'
          Generated by [.github/workflows/pulse.yml](../../blob/main/.github/workflows/pulse.yml) from [pulse/](../../tree/main/pulse). Rewritten on every run; do not edit.
          MD
          git init -q -b pulse
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "pulse: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pulse
