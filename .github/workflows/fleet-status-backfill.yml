# Manual: posts the fleet review-lane statuses on every open same-repo PR. Run it right after
# the fleet/* contexts become required checks, so PRs opened before that report.
name: Fleet status backfill

on:
  workflow_dispatch:

permissions: {}

jobs:
  backfill:
    # Dispatch only, so only our own branches run here: on askalf-exec, a backfill of the
    # fleet/verify and fleet/review statuses does not wait on GitHub's hosted queue.
    # A fork repository has no askalf-exec runners, so there it runs on GitHub's.
    runs-on: ${{ github.repository == 'askalf/askalf' && fromJSON('["self-hosted","askalf-exec"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: read
      statuses: write
    steps:
      - uses: askalf/ci/actions/fleet-status@5305beec29bdd65ff79d5b431d8c3a25fe945bb1 # main 2026-11-01, askalf/ci#141
        with:
          all-open: 'true'
