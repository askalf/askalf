# After each Scorecard run: checks that its result reached scorecard.dev, and dispatches Scorecard
# once more when it did not (askalf/ci, actions/scorecard-publish-check). scorecard-action reports
# a failed publish as a warning on a green run, and the README badge then goes stale, or reads
# "invalid repo path", with nothing red. It is a workflow of its own because scorecard.dev accepts
# results only from a job whose steps it recognises, so the check cannot be a step of scorecard.yml.
name: Scorecard publish check

on:
  workflow_run:
    workflows: [Scorecard]
    types: [completed]

permissions: {}

jobs:
  check:
    # A failed run is already red, and a private repository does not publish.
    if: github.event.workflow_run.conclusion == 'success' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # the one dispatch of the Scorecard workflow
    steps:
      - uses: askalf/ci/actions/scorecard-publish-check@c2432282ae781c574dc67e252fa013a76116efa2 # main 2026-11-13, askalf/ci#215
