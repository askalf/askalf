# Tests and renders the profile's live panels into the `pulse-out` artifact of the calling run.
# Called by pulse.yml (which then publishes) and pulse-check.yml (pull requests, render only).
# It holds a read-only token: it also runs on pull requests, where nothing may write.
name: pulse render

on:
  workflow_call:

permissions: {}

jobs:
  render:
    # Our own code (pushes, same-repo PRs, schedules, dispatches) runs on askalf-exec, our non-root
    # one-job runners, so GitHub's hosted queue going down does not hold our PRs. A fork's PR
    # and a Dependabot PR run code nobody here wrote, and a fork repository has no askalf-exec
    # runners, so those stay on GitHub's runners.
    runs-on: ${{ (github.repository != 'askalf/askalf' || github.event.pull_request && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]')) && 'ubuntu-latest' || fromJSON('["self-hosted","askalf-exec"]') }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: askalf/ci/actions/checkout-with-retry@78fffcd9ce52e62e63bf30d57f5a05583497bf7e # main 2026-11-05, askalf/ci#181
        with:
          persist-credentials: false

      - name: Test
        run: node --test pulse/data.test.mjs

      - name: Restore the last good state
        run: |
          mkdir -p out
          if git fetch --depth=1 origin pulse 2>/dev/null; then
            git show FETCH_HEAD:state.json > out/state.json || rm -f out/state.json
          fi

      - name: Render
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node pulse/render.mjs --out out | tee render.log
          {
            echo '### pulse'
            echo '```'
            cat render.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pulse-out
          path: out
          retention-days: 1
          if-no-files-found: error
