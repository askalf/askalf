  .lamp0 { animation: lamp0 8s linear infinite; }
  @keyframes lamp0 { 0%,7.9% { fill: #1a1330 } 8%,39.9% { fill: #fb4f6d } 40%,100% { fill: #1a1330 } }
  .lamp1 { animation: lamp1 8s linear infinite; }
  @keyframes lamp1 { 0%,12.9% { fill: #1a1330 } 13%,39.9% { fill: #fb4f6d } 40%,100% { fill: #1a1330 } }
  .lamp2 { animation: lamp2 8s linear infinite; }
  @keyframes lamp2 { 0%,17.9% { fill: #1a1330 } 18%,39.9% { fill: #fb4f6d } 40%,100% { fill: #1a1330 } }
  .lamp3 { animation: lamp3 8s linear infinite; }
  @keyframes lamp3 { 0%,22.9% { fill: #1a1330 } 23%,39.9% { fill: #fb4f6d } 40%,100% { fill: #1a1330 } }
  .lamp4 { animation: lamp4 8s linear infinite; }
  @keyframes lamp4 { 0%,27.9% { fill: #1a1330 } 28%,39.9% { fill: #fb4f6d } 40%,100% { fill: #1a1330 } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
</style>
