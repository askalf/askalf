  .job0 { animation: job0 8s linear infinite; }
  @keyframes job0 { 0%,39.9% { transform: translateX(0); opacity: 0 } 40% { opacity: 1 } 46.0% { transform: translateX(136px); opacity: 1 } 50.0%,100% { transform: translateX(136px); opacity: 0 } }

  .bar1 { transform-box: fill-box; transform-origin: left; animation: bar1 8s linear infinite; }
  @keyframes bar1 { 0%,40% { transform: scaleX(0) } 46.0%,100% { transform: scaleX(1) } }
  .job1 { animation: job1 8s linear infinite; }
