<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 316" width="1000" height="316" role="img" aria-labelledby="t">
<title id="t">pitlane: 2,791 jobs in the last 24 hours, median queue wait 2.0 s against a 5.0 s target, p90 12 s against 30 s. Both targets met.</title>
<style>
  text { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; }
