<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 556" width="640" height="556" role="img" aria-labelledby="t">
<title id="t">pitlane: 1,064 jobs in the last 24 hours, median queue wait 2.0 s against a 5.0 s target, p90 10 s against 30 s. Both targets met.</title>
<style>
  text { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; }
  .live { animation: live 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes live { 0%,100% { opacity: 1; transform: scale(1) } 50% { opacity: .35; transform: scale(.7) } }
  .ring { animation: ring 1.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes ring { 0% { opacity: .8; transform: scale(1) } 100% { opacity: 0; transform: scale(3.2) } }
  
  .bar0 { transform-box: fill-box; transform-origin: left; animation: bar0 8s linear infinite; }
  @keyframes bar0 { 0%,40% { transform: scaleX(0) } 46.0%,100% { transform: scaleX(1) } }
  .job0 { animation: job0 8s linear infinite; }
  @keyframes job0 { 0%,39.9% { transform: translateX(0); opacity: 0 } 40% { opacity: 1 } 46.0% { transform: translateX(115px); opacity: 1 } 50.0%,100% { transform: translateX(115px); opacity: 0 } }

  .bar1 { transform-box: fill-box; transform-origin: left; animation: bar1 8s linear infinite; }
  @keyframes bar1 { 0%,40% { transform: scaleX(0) } 45.0%,100% { transform: scaleX(1) } }
  .job1 { animation: job1 8s linear infinite; }
  @keyframes job1 { 0%,39.9% { transform: translateX(0); opacity: 0 } 40% { opacity: 1 } 45.0% { transform: translateX(96px); opacity: 1 } 49.0%,100% { transform: translateX(96px); opacity: 0 } }
  .lamp0 { animation: lamp0 8s linear infinite; }
  @keyframes lamp0 { 0%,7.9% { fill: #1a1330 } 8%,39.9% { fill: #fb4f6d } 40%,100% { fill: #1a1330 } }
  .lamp1 { animation: lamp1 8s linear infinite; }
  @keyframes lamp1 { 0%,12.9% { fill: #1a1330 } 13%,39.9% { fill: #fb4f6d } 40%,100% { fill: #1a1330 } }
  .lamp2 { animation: lamp2 8s linear infinite; }
  @keyframes lamp2 { 0%,17.9% { fill: #1a1330 } 18%,39.9% { fill: #fb4f6d } 40%,100% { fill: #1a1330 } }
  .lamp3 { animation: lamp3 8s linear infinite; }
  @keyframes lamp3 { 0%,22.9% { fill: #1a1330 } 23%,39.9% { fill: #fb4f6d } 40%,100% { fill: #1a1330 } }
  .lamp4 { animation: lamp4 8s linear infinite; }
  @keyframes lamp4 { 0%,27.9% { fill: #1a1330 } 28%,39.9% { fill: #fb4f6d } 40%,100% { fill: #1a1330 } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
</style>
<defs>
